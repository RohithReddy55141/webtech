<!DOCTYPE html>
<html>
<head>

    <title>Debug CSS and JavaScript</title>

    <style>

        body {
            font-family: Arial;
            background-color: #f2f5f9;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 10px gray;
        }

        h1 {
            color: #173b7a;
        }

        input {
            padding: 10px;
            margin: 5px;
        }

        button {
            padding: 10px 20px;
            background-color: #173b7a;
            color: white;
            border: none;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-weight: bold;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>
        Debug and Correct Web Application
    </h1>

    <p>
        <b>Student:</b> Rohith Reddy
    </p>

    <p>
        Enter two numbers and click the button.
    </p>

    <input
        type="number"
        id="num1"
        placeholder="First Number">

    <input
        type="number"
        id="num2"
        placeholder="Second Number">

    <button onclick="addNumbers()">
        Add Numbers
    </button>

    <p id="result"></p>

    <hr>

    <h3>
        Console Debugging
    </h3>

    <button onclick="debugConsole()">
        Run Debug
    </button>

    <p>
        Press <b>F12</b> and open the
        <b>Console</b> to see debugging messages.
    </p>

</div>

<script>

function addNumbers() {

    try {

        let first =
            document.getElementById("num1").value;

        let second =
            document.getElementById("num2").value;

        if (first === "" || second === "") {

            throw new Error(
                "Please enter both numbers."
            );

        }

        let number1 =
            Number(first);

        let number2 =
            Number(second);

        let result =
            number1 + number2;

        let output =
            document.getElementById("result");

        output.innerHTML =
            "Result: " + result;

        output.className =
            "success";

        console.log(
            "Calculation:",
            number1,
            "+",
            number2,
            "=",
            result
        );

    }

    catch(error) {

        let output =
            document.getElementById("result");

        output.innerHTML =
            error.message;

        output.className =
            "error";

        console.error(
            "Error:",
            error.message
        );

    }

}


function debugConsole() {

    console.log(
        "Debugging started..."
    );

    console.log(
        "Student: Rohith Reddy"
    );

    console.log(
        "Course: B.Tech Information Technology"
    );

    console.log(
        "College: SIMATS Engineering"
    );

    console.log(
        "JavaScript is working correctly."
    );

}

</script>

</body>
</html>
