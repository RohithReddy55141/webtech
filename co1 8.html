<!DOCTYPE html>
<html>
<head>
    <title>Images, Hyperlinks and Iframes</title>
</head>

<body>

    <h1>My College Web Page</h1>

    <h2>Student Details</h2>

    <p>
        Name: <b>Junna Rohith Reddy</b>
    </p>

    <p>
        Course: B.Tech Information Technology
    </p>

    <p>
        College: SIMATS Engineering
    </p>

    <hr>

    <h2>Student Image</h2>

    <img src="student.jpg"
         alt="Student Image"
         width="250"
         height="250">

    <hr>

    <h2>Useful Hyperlinks</h2>

    <a href="https://www.google.com"
       target="_blank">
       Visit Google
    </a>

    <br><br>

    <a href="https://www.wikipedia.org"
       target="_blank">
       Visit Wikipedia
    </a>

    <hr>

    <h2>Iframe</h2>

    <iframe
        src="https://www.example.com"
        width="700"
        height="400"
        title="External Web Page">
    </iframe>

</body>
</html>
