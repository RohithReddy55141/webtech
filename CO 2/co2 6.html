<!DOCTYPE html>
<html>
<head>

    <title>To-Do List</title>

    <style>

        body {
            font-family: Arial;
            background-color: #f2f5f9;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px gray;
        }

        h1 {
            color: #173b7a;
            text-align: center;
        }

        input {
            width: 70%;
            padding: 12px;
        }

        button {
            padding: 10px 15px;
            background-color: #173b7a;
            color: white;
            border: none;
            margin: 3px;
        }

        .task {
            display: flex;
            justify-content: space-between;
            background-color: #eef3ff;
            padding: 10px;
            margin-top: 10px;
        }

        .completed {
            text-decoration: line-through;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Dynamic To-Do List</h1>

    <p>
        <b>Student:</b> Rohith Reddy
    </p>

    <input
        type="text"
        id="taskInput"
        placeholder="Enter a task">

    <button onclick="addTask()">
        Add
    </button>

    <div id="taskList"></div>

</div>

<script>

let tasks = [];

function addTask() {

    let input =
        document.getElementById("taskInput");

    let text =
        input.value.trim();

    if (text === "") {

        alert("Please enter a task.");

        return;
    }

    tasks.push({
        text: text,
        completed: false
    });

    input.value = "";

    displayTasks();

}

function displayTasks() {

    let list =
        document.getElementById("taskList");

    list.innerHTML = "";

    tasks.forEach(function(task, index) {

        let div =
            document.createElement("div");

        div.className = "task";

        div.innerHTML = `

            <span
                class="${task.completed ? "completed" : ""}"
                onclick="completeTask(${index})">

                ${task.text}

            </span>

            <span>

                <button onclick="editTask(${index})">
                    Edit
                </button>

                <button onclick="deleteTask(${index})">
                    Delete
                </button>

            </span>

        `;

        list.appendChild(div);

    });

}

function completeTask(index) {

    tasks[index].completed =
        !tasks[index].completed;

    displayTasks();

}

function editTask(index) {

    let newTask =
        prompt(
            "Edit Task:",
            tasks[index].text
        );

    if (newTask !== null &&
        newTask.trim() !== "") {

        tasks[index].text =
            newTask.trim();

        displayTasks();

    }

}

function deleteTask(index) {

    tasks.splice(index, 1);

    displayTasks();

}

</script>

</body>
</html>
