<!DOCTYPE html>
<html>
<head>

    <title>Digital Clock and Countdown</title>

    <style>

        body {
            font-family: Arial;
            background-color: #f2f5f9;
            text-align: center;
        }

        .container {
            max-width: 700px;
            margin: 50px auto;
            background-color: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 3px 10px gray;
        }

        h1 {
            color: #173b7a;
        }

        #clock {
            font-size: 50px;
            font-weight: bold;
            color: #173b7a;
            margin: 25px;
        }

        #countdown {
            font-size: 30px;
            color: red;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>
        Digital Clock
    </h1>

    <p>
        <b>Student:</b> Rohith Reddy
    </p>

    <div id="clock">
        00:00:00
    </div>

    <h2>
        Examination Countdown
    </h2>

    <div id="countdown">
        Loading...
    </div>

</div>

<script>

function updateClock() {

    let now = new Date();

    document.getElementById("clock")
        .innerHTML =
        now.toLocaleTimeString();

}

setInterval(updateClock, 1000);

updateClock();


/*
Change the examination date here.
*/

let examDate =
    new Date("2026-09-01T09:00:00")
    .getTime();


function updateCountdown() {

    let current =
        new Date().getTime();

    let difference =
        examDate - current;

    if (difference <= 0) {

        document.getElementById("countdown")
            .innerHTML =
            "Examination Started!";

        return;
    }

    let days =
        Math.floor(
            difference /
            (1000 * 60 * 60 * 24)
        );

    let hours =
        Math.floor(
            (difference %
            (1000 * 60 * 60 * 24)) /
            (1000 * 60 * 60)
        );

    let minutes =
        Math.floor(
            (difference %
            (1000 * 60 * 60)) /
            (1000 * 60)
        );

    let seconds =
        Math.floor(
            (difference %
            (1000 * 60)) /
            1000
        );

    document.getElementById("countdown")
        .innerHTML =

        days + " Days " +
        hours + " Hours " +
        minutes + " Minutes " +
        seconds + " Seconds";

}

setInterval(updateCountdown, 1000);

updateCountdown();

</script>

</body>
</html>
