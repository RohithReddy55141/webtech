    <h2>Network Test</h2>

    <button onclick="loadData()">
        Send HTTP Request
    </button>

    <p id="result"></p>

    <script>
        function loadData() {

            fetch("https://jsonplaceholder.typicode.com/posts/1")
                .then(response => response.json())
                .then(data => {

                    document.getElementById("result").innerHTML =
                        "Request completed successfully.";

                    console.log(data);

                })
                .catch(error => {

                    document.getElementById("result").innerHTML =
                        "Request failed.";

                    console.error(error);

                });
        }
    </script>

</body>
