<!DOCTYPE html>
<html>
<head>

    <title>Online Quiz</title>

    <style>

        body {
            font-family: Arial;
            background-color: #f2f5f9;
        }

        .quiz {
            max-width: 700px;
            margin: 40px auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px gray;
        }

        h1 {
            color: #173b7a;
            text-align: center;
        }

        .question {
            background-color: #eef3ff;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
        }

        label {
            display: block;
            margin: 8px;
        }

        button {
            padding: 12px 25px;
            background-color: #173b7a;
            color: white;
            border: none;
        }

        #result {
            font-size: 20px;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="quiz">

    <h1>Online Quiz</h1>

    <p>
        <b>Student:</b> Rohith Reddy
    </p>

    <div class="question">

        <p>
            <b>1. Which language is used to structure
            a webpage?</b>
        </p>

        <label>
            <input type="radio" name="q1" value="HTML">
            HTML
        </label>

        <label>
            <input type="radio" name="q1" value="CSS">
            CSS
        </label>

        <label>
            <input type="radio" name="q1" value="Python">
            Python
        </label>

    </div>

    <div class="question">

        <p>
            <b>2. Which language is used for styling?</b>
        </p>

        <label>
            <input type="radio" name="q2" value="CSS">
            CSS
        </label>

        <label>
            <input type="radio" name="q2" value="HTML">
            HTML
        </label>

        <label>
            <input type="radio" name="q2" value="Java">
            Java
        </label>

    </div>

    <div class="question">

        <p>
            <b>3. Which language adds interactivity?</b>
        </p>

        <label>
            <input type="radio"
                   name="q3"
                   value="JavaScript">
            JavaScript
        </label>

        <label>
            <input type="radio" name="q3" value="HTML">
            HTML
        </label>

        <label>
            <input type="radio" name="q3" value="SQL">
            SQL
        </label>

    </div>

    <button onclick="checkQuiz()">
        Submit Quiz
    </button>

    <p id="result"></p>

</div>

<script>

function checkQuiz() {

    let score = 0;

    let q1 =
        document.querySelector(
            'input[name="q1"]:checked'
        );

    let q2 =
        document.querySelector(
            'input[name="q2"]:checked'
        );

    let q3 =
        document.querySelector(
            'input[name="q3"]:checked'
        );

    if (q1 && q1.value === "HTML")
        score++;

    if (q2 && q2.value === "CSS")
        score++;

    if (q3 && q3.value === "JavaScript")
        score++;

    document.getElementById("result").innerHTML =
        "Rohith Reddy - Score: " +
        score + " / 3";

}

</script>

</body>
</html>
