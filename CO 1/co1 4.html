<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
</head>

<body>

    <h1>Student Registration Form</h1>

    <form action="#" method="post">

        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name"
               value="Junna Rohith Reddy">
        <br><br>

        <label for="roll">Roll Number:</label>
        <input type="text" id="roll" name="roll"
               placeholder="Enter Roll Number">
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email"
               placeholder="Enter Email">
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password">
        <br><br>

        <label>Gender:</label>

        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>

        <br><br>

        <label>Skills:</label>

        <input type="checkbox" id="html" name="skills" value="HTML">
        <label for="html">HTML</label>

        <input type="checkbox" id="css" name="skills" value="CSS">
        <label for="css">CSS</label>

        <input type="checkbox" id="python" name="skills" value="Python">
        <label for="python">Python</label>

        <br><br>

        <label for="course">Select Course:</label>

        <select id="course" name="course">
            <option value="IT">B.Tech Information Technology</option>
            <option value="CSE">B.Tech Computer Science</option>
            <option value="ECE">B.Tech Electronics</option>
            <option value="MECH">B.Tech Mechanical</option>
        </select>

        <br><br>

        <label for="address">Address:</label>
        <br>

        <textarea id="address" name="address"
                  rows="5" cols="40"
                  placeholder="Enter your address"></textarea>

        <br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
